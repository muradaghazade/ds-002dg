<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Replies · A little date?</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="./admin.js"></script>
</head>
<body>
  <main class="shell admin">
    <header class="masthead"><span class="brand-heart" aria-hidden="true">♥</span> A little date?</header>
    <article class="paper">
      <div class="topline"><a href="../">← Invitation</a><button class="secondary" id="sign-out" hidden>Sign out</button></div>
      <h1>Replies</h1>
      <p id="local-note" class="intro" hidden>Replies stored in this browser.</p>
      <form id="login" hidden>
        <p>Sign in to see your replies.</p>
        <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
        <button class="primary">Sign in</button>
      </form>
      <p id="status" class="status" role="status"></p>
      <div id="content" class="response-list"></div>
    </article>
  </main>
</body>
</html>
